<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Grid Pattern -->
  <g stroke="url(#gridGradient)" stroke-width="0.5" fill="none" opacity="0.3">
    <!-- Vertical lines -->
    <line x1="200" y1="0" x2="200" y2="1080"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1000" y1="0" x2="1000" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1400" y1="0" x2="1400" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1800" y1="0" x2="1800" y2="1080"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>
  
  <!-- Rising Chart Line (left side) -->
  <g opacity="0.6">
    <path 
      d="M0 800 Q100 750 200 720 T400 650 T600 580 T800 500 T1000 420 T1200 350 T1400 290 T1600 240 T1800 200 L1920 180" 
      stroke="#10b981" 
      stroke-width="3" 
      fill="none"
      stroke-linecap="round"
    />
    <path 
      d="M0 800 Q100 750 200 720 T400 650 T600 580 T800 500 T1000 420 T1200 350 T1400 290 T1600 240 T1800 200 L1920 180 L1920 1080 L0 1080 Z" 
      fill="url(#chartGradient)"
      opacity="0.15"
    />
  </g>
  
  <!-- Secondary Chart Line -->
  <path 
    d="M0 850 Q150 820 300 800 T600 750 T900 680 T1200 600 T1500 530 T1920 450" 
    stroke="#8b5cf6" 
    stroke-width="2" 
    fill="none"
    stroke-linecap="round"
    opacity="0.4"
    stroke-dasharray="10,5"
  />
  
  <!-- Floating Circles (representing data points) -->
  <g fill="#6366f1" opacity="0.5">
    <circle cx="200" cy="720" r="8"/>
    <circle cx="400" cy="650" r="6"/>
    <circle cx="600" cy="580" r="10"/>
    <circle cx="800" cy="500" r="7"/>
    <circle cx="1000" cy="420" r="9"/>
    <circle cx="1200" cy="350" r="6"/>
    <circle cx="1400" cy="290" r="8"/>
    <circle cx="1600" cy="240" r="5"/>
  </g>
  
  <!-- Geometric Shapes -->
  <g opacity="0.25">
    <!-- Top right corner decoration -->
    <polygon points="1800,50 1870,100 1800,150" fill="#6366f1"/>
    <polygon points="1750,80 1790,120 1750,160" fill="#8b5cf6"/>
    
    <!-- Bottom left corner decoration -->
    <rect x="50" y="950" width="40" height="40" fill="#10b981" transform="rotate(15 70 970)"/>
    <rect x="100" y="980" width="25" height="25" fill="#06b6d4" transform="rotate(-10 112 992)"/>
    
    <!-- Floating squares -->
    <rect x="1700" y="400" width="30" height="30" fill="#8b5cf6" transform="rotate(45 1715 415)"/>
    <rect x="150" y="300" width="20" height="20" fill="#6366f1" transform="rotate(30 160 310)"/>
    
    <!-- Abstract circles -->
    <circle cx="1800" cy="600" r="40" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <circle cx="1800" cy="600" r="25" stroke="#06b6d4" stroke-width="1" fill="none"/>
    <circle cx="120" cy="500" r="35" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Bar Chart Elements (right side) -->
  <g opacity="0.3" transform="translate(1650, 700)">
    <rect x="0" y="80" width="30" height="120" fill="#6366f1" rx="4"/>
    <rect x="40" y="40" width="30" height="160" fill="#8b5cf6" rx="4"/>
    <rect x="80" y="60" width="30" height="140" fill="#10b981" rx="4"/>
    <rect x="120" y="20" width="30" height="180" fill="#06b6d4" rx="4"/>
  </g>
  
  <!-- Pie Chart Element (left side) -->
  <g opacity="0.25" transform="translate(100, 150)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#e5e7eb" stroke-width="12"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#6366f1" stroke-width="12" 
            stroke-dasharray="100 215" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#10b981" stroke-width="12" 
            stroke-dasharray="80 235" stroke-dashoffset="-100" transform="rotate(-90 60 60)"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#8b5cf6" stroke-width="12" 
            stroke-dasharray="60 255" stroke-dashoffset="-180" transform="rotate(-90 60 60)"/>
  </g>
  
  <!-- Currency Symbols -->
  <g font-family="Arial, sans-serif" font-weight="bold" opacity="0.15">
    <text x="300" y="200" font-size="80" fill="#6366f1">$</text>
    <text x="1500" y="300" font-size="60" fill="#8b5cf6">€</text>
    <text x="1100" y="900" font-size="70" fill="#10b981">R$</text>
    <text x="500" y="800" font-size="50" fill="#06b6d4">¥</text>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.2">
    <line x1="200" y1="720" x2="300" y2="200"/>
    <line x1="1000" y1="420" x2="1100" y2="900"/>
    <line x1="1400" y1="290" x2="1500" y2="300"/>
  </g>
</svg>